services:
  energy-monitor:
    image: ghcr.io/puijken/energy-monitor:latest
    environment:
      - TZ=Europe/Amsterdam
      # Inverter / dongle address on your network
      - INVERTER_HOST=192.168.1.50
      - INVERTER_PORT=502
      - SCAN_INTERVAL=15
      - POSTGRES_HOST=timescaledb
      - POSTGRES_DB=energy
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Broker used to (optionally) publish inverter/electricity readings and, if ENABLE_PLUGS is
      # set, to consume Zigbee2MQTT. ENABLE_MQTT_PUBLISH defaults to false, so it's set explicitly
      # here -- otherwise MQTT_HOST below configures a broker connection that's never opened.
      - MQTT_HOST=192.168.1.10
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - ENABLE_MQTT_PUBLISH=true
      # Two independent topic trees, both gated by ENABLE_MQTT_PUBLISH above: inverter readings
      # under the first, smart-meter electricity under the second (needs ENABLE_P1 below).
      # Separate so a subscriber can take either side without filtering the other out.
      - MQTT_TOPIC_PREFIX=energy/solar
      - MQTT_ELEC_TOPIC_PREFIX=energy/electricity
      # Smart meter, read directly off the P1 telegram stream -- a plain-TCP relay of the meter's
      # P1 port (e.g. a ser2net `connection:` block), not DSMR-reader's MQTT export or database.
      # See README.md ("Smart-meter data") for why, and for sharing one P1 port between this
      # container and something else that also reads it (DSMR-reader, a display, etc.).
      - ENABLE_P1=true
      - P1_HOST=192.168.1.20
      - P1_PORT=2001
      - ENABLE_PVOUTPUT=false
      - PVOUTPUT_API_KEY=${PVOUTPUT_API_KEY}
      - PVOUTPUT_SYSTEM_ID=${PVOUTPUT_SYSTEM_ID}
      - ENABLE_MINDERGAS=false
      - MINDERGAS_API_KEY=${MINDERGAS_API_KEY}
    restart: unless-stopped
