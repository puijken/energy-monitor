name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Builds are otherwise on-demand. This monthly run exists only to refresh the base image: it is
  # pinned by tag, and Dependabot bumps tags rather than digests, so an upstream security rebuild
  # of the same tag produces no PR and therefore no build. No `no-cache` is needed -- there is no
  # layer cache configured and `pull: true` below re-resolves the tag against the registry, so
  # every build is already fully fresh. This only guarantees one happens.
  schedule:
    - cron: '0 1 1 * *'  # 01:00 UTC on the 1st of each month

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Required for `load: true` to export the built image into the local docker daemon.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and smoke-tested before publishing, so a dependency bump that breaks the Modbus
      # decoding at runtime can never reach :latest. Deliberately not relying on pr-validate for
      # this: dependabot auto-merge only waits for checks that branch protection marks required.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          pull: true
          load: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Smoke test
        run: |
          docker run --rm \
            -v "$PWD/smoke_test.py:/app/smoke_test.py:ro" \
            ghcr.io/${{ github.repository }}:latest python3 /app/smoke_test.py

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}:latest
