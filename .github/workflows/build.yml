name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Required for `load: true` to export the built image into the local docker daemon.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and smoke-tested before publishing, so a dependency bump that breaks the Modbus
      # decoding at runtime can never reach :latest. Deliberately not relying on pr-validate for
      # this: dependabot auto-merge only waits for checks that branch protection marks required.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          pull: true
          load: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Smoke test
        run: |
          docker run --rm \
            -v "$PWD/smoke_test.py:/app/smoke_test.py:ro" \
            ghcr.io/${{ github.repository }}:latest python3 /app/smoke_test.py

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}:latest
